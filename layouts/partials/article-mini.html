<article class="article article--mini">
  <header class="article__header article__header--compact">
    <h3 class="article__title">
      <a class="article__link no-underline" href="{{ .RelPermalink }}">{{ .Title }}</a>
    </h3>
    <time class="article__date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time>
  </header>
</article>
